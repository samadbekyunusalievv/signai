name: Check

# The site itself is published by GitHub Pages straight from the main branch.
# This check makes sure tests pass and the committed signai.html matches the sources.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: npm test

      - name: signai.html is up to date
        run: |
          npm run build
          git diff --exit-code signai.html || (echo "::error::signai.html is stale — run 'npm run build' and commit it" && exit 1)
